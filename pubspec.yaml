name: plantcare
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  lottie: ^3.3.1
  image_picker: ^1.1.2
  cloudinary: ^1.2.0
  salomon_bottom_bar: ^3.3.2
  intl: ^0.20.2
  rxdart: ^0.27.7
  stylish_bottom_bar: ^1.1.1
  razorpay_flutter: ^1.4.0
  http: ^1.0.0
  carousel_slider: ^5.0.0
  url_launcher: ^6.2.5
  fluttertoast: ^8.2.1
  model_viewer_plus: ^1.9.3
  file_picker: ^10.1.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  
  

flutter:

  uses-material-design: true

  assets:
    - asset/
    - asset/fonts/
    - asset/image/
    - asset/animation/


  fonts:
    - family: Poppins
      fonts:
        - asset: asset\fonts\Poppins Regular.ttf
        - asset: asset\fonts\Poppins Medium.ttf
          weight: 600
        - asset: asset\fonts\Poppins Light.ttf
          weight: 400

    - family: Delicious
      fonts:
        - asset: asset\fonts\Delicious Handrawn.ttf

    - family: Milky
      fonts:
        - asset: asset\fonts\Milky Matcha.otf

    - family: Montserrat
      fonts:
        - asset: asset\fonts\Montserrat Regular.ttf
          weight: 400
        - asset: asset\fonts\Montserrat Bold.ttf
          weight: 700

    - family: Pacifico
      fonts:
        - asset: asset/fonts/Pacifico Regular.ttf

    - family: Pinkish
      fonts:
        - asset: asset/fonts/PinkishRegular.ttf

    - family: Happy Autumn
      fonts:
        - asset: asset/fonts/HappyAutumn.otf
          weight: 700

    - family: CrowdGlory
      fonts:
        - asset: asset/fonts/Crowd Glory Regular.otf

    - family: DugiPundi
      fonts:
        - asset: asset/fonts/Dugi Pundi.ttf

    - family: PaintingTheTown
      fonts:
        - asset: asset/fonts/Painting The Town.ttf

    - family: Smile Family
      fonts:
        - asset: asset/fonts/Smile Family.otf

    - family: Risperd Marfiel Display
      fonts:
        - asset: asset/fonts/Risperd Marfiel Display.otf

    - family: TClip
      fonts:
        - asset: asset/fonts/TClip.ttf

    - family: Playfair Display
      fonts:
        - asset: asset/fonts/Playfair Display.ttf

    - family: Libre Baskerville
      fonts:
        - asset: asset/fonts/Libre Baskerville Regular.ttf
    - family: Callido
      fonts:
        - asset: asset/fonts/Callido.otf
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/image/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: 'asset/image/logo.png'
  remove_alpha_ios: true
  assets:
    - asset/image/logo.png